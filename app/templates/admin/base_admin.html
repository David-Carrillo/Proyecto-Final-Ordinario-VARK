{% extends "base.html" %}
{# Diseño de la zona privada. Responsable: Valeria #}
{% block contenido %}
<div class="row g-4">
  <aside class="col-lg-3">
    <div class="tarjeta menu-admin">
      <p class="small text-muted mb-2"><i class="bi bi-person-circle"></i> {{ admin_actual.nombre }}</p>
      {% set ruta = request.endpoint or '' %}
      <nav class="nav flex-column">
        <a class="nav-link {% if ruta == 'admin.panel' %}active{% endif %}" href="{{ url_for('admin.panel') }}"><i class="bi bi-speedometer2"></i> Panel</a>
        <a class="nav-link {% if ruta == 'admin.dashboard' %}active{% endif %}" href="{{ url_for('admin.dashboard') }}"><i class="bi bi-bar-chart"></i> Resultados y gráficas</a>
        <a class="nav-link {% if ruta.startswith('admin.alumno') %}active{% endif %}" href="{{ url_for('admin.alumnos') }}"><i class="bi bi-people"></i> Alumnos</a>
        <a class="nav-link {% if ruta.startswith('admin.administrador') %}active{% endif %}" href="{{ url_for('admin.administradores') }}"><i class="bi bi-shield-lock"></i> Administradores</a>
        <a class="nav-link {% if ruta.startswith('admin.tipo') %}active{% endif %}" href="{{ url_for('admin.tipos') }}"><i class="bi bi-person-badge"></i> Tipos de personalidad</a>
        <a class="nav-link {% if ruta.startswith('admin.mensaje') %}active{% endif %}" href="{{ url_for('admin.mensajes') }}"><i class="bi bi-envelope"></i> Mensajes</a>
      </nav>
      <form action="{{ url_for('auth.logout') }}" method="post" class="mt-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-outline-secondary btn-sm w-100"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
      </form>
    </div>
  </aside>
  <section class="col-lg-9">
    {% block admin %}{% endblock %}
  </section>
</div>
{% endblock %}
