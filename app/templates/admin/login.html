{% extends "base.html" %}
{# Login de administradores. Responsable: Gerardo #}
{% block titulo %}Acceso administradores{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="caja-login">
      <h1 class="h4">Acceso administradores</h1>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="usuario">Usuario</label>
        <input class="form-control mb-2" id="usuario" name="usuario" required autofocus>
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control mb-2" id="password" name="password" type="password" required>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="recordar" id="recordar">
          <label class="form-check-label" for="recordar">Recordarme</label>
        </div>
        <button class="btn btn-rojo w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
